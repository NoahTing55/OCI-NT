# Alembic 配置：管理表结构迁移。
#
# lifespan 里 Base.metadata.create_all 仍然保留（新库一键建表，幂等）；
# 已有库的结构变更走这里：cd backend && alembic upgrade head
# 0001 迁移是幂等的（建表/加字段前先检查是否存在），不会破坏已有表。

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
