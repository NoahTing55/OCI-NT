[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=bash -c 'PGVER=$(ls /usr/lib/postgresql/ | head -1); exec /usr/lib/postgresql/$PGVER/bin/postgres -D /var/lib/postgresql/data'
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.log
priority=1

[program:redis]
command=redis-server --dir /data --dbfilename dump.rdb
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.log
priority=2

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8035
directory=/code
autostart=true
autorestart=true
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.log
priority=10
; 等 postgres 就绪后再启动
startsecs=10

[program:worker]
command=celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=4
directory=/code
autostart=true
autorestart=true
stdout_logfile=/var/log/worker.log
stderr_logfile=/var/log/worker.log
priority=20
startsecs=15
