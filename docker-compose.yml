version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oci
      POSTGRES_PASSWORD: oci
      POSTGRES_DB: ocipanel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oci"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://api:8000
    depends_on:
      - api

  # Celery worker：批量开机/关机/重启/终止等耗时任务走这里；
  # APScheduler 定时检查（存活/代理测速）仍在 api 进程内
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --concurrency=4
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
